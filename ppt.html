<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茂偉低碳 · 工商業光伏 25 年投資「五步靈魂拷問」PPT 簡報</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #020b14;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 16:9 Slide Stage */
  #stage-wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #02080f;
  }
  .slide-container {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: radial-gradient(circle at 50% 15%, #0369a1 0%, #075985 30%, #0f172a 75%, #020617 100%);
    border: 1.5px solid rgba(56,189,248,0.35);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3.2vw 4.8vw 2.5vw;
    box-shadow: 0 25px 60px rgba(2,6,23,0.9), 0 0 40px rgba(56,189,248,0.15);
    transition: opacity .3s ease;
  }

  /* Header */
  .slide-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 1vw;
  }
  .slide-tag {
    font-size: 1.1vw;
    font-weight: 800;
    letter-spacing: 2px;
    color: #38bdf8;
    text-transform: uppercase;
  }
  .brand-logo {
    font-size: 1vw;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.6);
  }

  /* Main Body */
  .slide-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 1vw 0;
  }
  .slide-title {
    font-size: 2.3vw;
    font-weight: 800;
    line-height: 1.3;
    color: #ffffff;
    margin-bottom: 1vw;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .slide-context {
    font-size: 1.2vw;
    line-height: 1.6;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.35);
    border-left: 3px solid #38bdf8;
    padding: 0.8vw 1.2vw;
    border-radius: 4px;
    margin-bottom: 1.4vw;
  }
  .soul-question-box {
    background: linear-gradient(135deg, rgba(239,68,68,0.18), rgba(15,23,42,0.7));
    border: 1.5px solid rgba(248,113,113,0.45);
    border-radius: 8px;
    padding: 1.1vw 1.4vw;
    margin-bottom: 1.4vw;
  }
  .soul-label {
    font-size: 1.05vw;
    font-weight: 800;
    color: #f87171;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 0.4vw;
    margin-bottom: 0.4vw;
  }
  .soul-text {
    font-size: 1.4vw;
    font-weight: 800;
    line-height: 1.5;
    color: #ffffff;
  }

  /* Answer Reveal Box */
  .answer-zone {
    min-height: 5.5vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .blank-btn {
    width: 100%;
    padding: 1vw 1.5vw;
    background: rgba(0,0,0,0.5);
    border: 2px dashed rgba(56,189,248,0.6);
    border-radius: 8px;
    color: #7dd3fc;
    font-size: 1.2vw;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    text-align: center;
    transition: all .2s;
  }
  .blank-btn:hover {
    background: rgba(14,165,233,0.2);
    border-color: #38bdf8;
    color: #fff;
    box-shadow: 0 0 25px rgba(56,189,248,0.35);
  }
  .revealed-answer {
    width: 100%;
    background: linear-gradient(135deg, rgba(14,165,233,0.3) 0%, rgba(3,105,161,0.5) 100%);
    border: 1.5px solid #38bdf8;
    border-radius: 8px;
    padding: 1vw 1.4vw;
    box-shadow: 0 8px 30px rgba(14,165,233,0.3);
    animation: fadeIn .3s ease;
  }
  .ans-title {
    font-size: 1.05vw;
    font-weight: 800;
    color: #38bdf8;
    margin-bottom: 0.3vw;
  }
  .ans-content {
    font-size: 1.25vw;
    font-weight: 700;
    line-height: 1.6;
    color: #ffffff;
  }

  /* Footer & Navigation */
  .slide-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 0.8vw;
    font-size: 0.95vw;
    color: rgba(255,255,255,0.5);
  }
  .nav-hints {
    display: flex;
    gap: 0.8vw;
  }
  .nav-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 0.3vw 0.8vw;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9vw;
    transition: background .2s;
  }
  .nav-btn:hover { background: rgba(56,189,248,0.3); border-color: #38bdf8; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="stage-wrap">
  <div class="slide-container" id="slide"></div>
</div>

<script>
const SLIDES = [
  // Slide 0: 封面
  {
    type: 'cover',
    tag: '茂偉低碳 · 工商業決策學院',
    title: '讀懂光伏電站投資 —— 25 年真算帳',
    subtitle: '別被「總價便宜」騙了',
    note: '按 空白鍵 (Space) 或 右方向鍵 (➔) 進入第一頁靈魂拷問'
  },
  // Slide 1: 第 01 步 · 材料工程篇
  {
    tag: '第 01 步 · 材料工程篇',
    title: '「組件、逆變器都用一樣的一線大廠，品質應該差不到哪裡去？」',
    context: '業主常問：「既然兩份報價單都寫著大廠組件、大廠逆變器，那選總價便宜的施工隊來裝，硬體都一樣，有什麼差別？」',
    q: '光伏電站是要承受 25 年暴雨強風的高壓精密發電廠——如果只是把大廠零件買齊、找工班在屋頂拼裝，會留下哪些致命隱患？',
    ans: '【組件貓膩】海退B規次級板充數 ＋【屋頂漏水】粗暴穿孔打膠 ＋【系統失配】散熱不良直流拉弧！',
    detail: '光伏是「25 年精密系統工程」，絕非買零件煮火鍋！茂偉堅持「原廠 A 規溯源防偽」＋「專利無損夾具」，承諾 25 年 100% 零漏水！'
  },
  // Slide 3: 第 02 步 · 發電數據篇
  {
    tag: '第 02 步 · 發電數據篇',
    title: '宣傳冊寫年發電 60 萬度，如何判斷是不是畫大餅？',
    context: '每家廠商宣傳冊都印著漂亮的「理論發電量預估表」。',
    q: '要客觀驗證廠商承諾的發電效率究竟能不能兌現，如何只用一張電費單，算出最權威的發電硬指標？',
    ans: '查驗周邊電站真實帳單，核算「年度有效發電小時數」（總度數 ÷ 裝機容量）！',
    detail: '劣質系統 1,000 小時 vs 茂偉實測 1,200 小時以上（上海/昆山/蘇州實績）。年差 200 小時 ＝ 500kWp 電站 25 年多發 250 萬度電！'
  },
  // Slide 4: 第 03 步 · 併網時程篇
  {
    tag: '第 03 步 · 併網時程篇',
    title: '簽完約就等著收電費？業主忽視的「併網時間黑洞」',
    context: '500kWp 電站每月發電 5.5 萬度（產值約 4.4 萬元）。低價隊前期不審供電局變壓器容量，設備上屋頂才發現卡死。',
    q: '若因電網審批卡關延遲 3 個月才正式併網通電，工廠帳面上將實質蒸發多少電費？',
    ans: '白白蒸發 13.2 萬元！在開工第一天就把省下的總價差價全部賠光倒貼！',
    detail: '供電局絕不補償拖延損失。茂偉簽約前即完成電網容量審核，2 年實績 100% 於 60~90 天內如期併網交付。'
  },
  // Slide 5: 第 04 步 · 運維真相篇
  {
    tag: '第 04 步 · 運維真相篇',
    title: '每家投標都承諾「質保 25 年」，這話到底能不能信？',
    context: '25 年質保是「組件原廠」給的材料保固，原廠不包爬屋頂檢測；低價施工隊完工 2~3 年後解散跑路。',
    q: '第 4 年組件發生熱斑衰減，原廠要求提供「IV/EL 檢測報告並自行拆卸」，工廠無人無儀器，誰來幫你向原廠出保？',
    ans: '原廠質保淪為空頭支票！唯有具備「自持 15MW 實體電站 ＋ 每年近 1,000 萬電費現金流」的茂偉代辦出保！',
    detail: '茂偉自持 15,000,000 瓦電站，年收近千萬電費，擁有專職工程團隊與無人機 IR 特檢設備，25 年絕不淪為孤兒電站！'
  },
  // Slide 6: 第 05 步 · LCOE 算帳篇
  {
    tag: '第 05 步 · LCOE 算帳篇',
    title: '低價 110 萬 vs 專業 120 萬，誰才是真正的高性價比？',
    context: '500kWp 電站，低價 110 萬（25年維修85萬，累計發電1250萬度）；茂偉 120 萬（25年維修35萬，累計發電1500萬度）。',
    q: '非貼現 LCOE ＝ 25 年實付總支出 ÷ 25 年累計總發電量，算完 25 年這筆總帳後，唯一的財務結論是？',
    ans: '選茂偉 25 年實付總支出反而更便宜（省下 40 萬：155萬 vs 195萬）！',
    detail: '多發 250 萬度電，度電成本狂降 33.8%（0.103 元/度 vs 0.156 元/度）。選茂偉不是買貴，而是為工廠多賺數百萬！'
  },
  // Slide 7: 總結宣誓
  {
    type: 'closing',
    tag: '結語 · 終極決策',
    title: '「我不再只盯誰總價便宜了。」',
    weapons: [
      '<b>材料工程</b>：原廠 A 規防偽 ＋ 專利無損夾具（承諾 100% 零漏水）',
      '<b>發電實證</b>：年有效發電 1,200 小時（25 年多發 250 萬度電）',
      '<b>併網時效</b>：前期確信審查（60~90 天確定併網，防 13.2 萬損失）',
      '<b>運維閉環</b>：自持 15MW 電站 / 年收近千萬現金流（25 年代辦出保）',
      '<b>LCOE算帳</b>：非貼現度電成本 0.103 元/度（總支出反而省下 40 萬）'
    ]
  }
];

let cur = 0;
let revealed = false;

function render() {
  const s = SLIDES[cur];
  const el = document.getElementById('slide');
  
  if (s.type === 'cover') {
    el.innerHTML = `
      <div class="slide-header">
        <span class="slide-tag">${s.tag}</span>
        <span class="brand-logo">MOWINTECH 茂偉低碳</span>
      </div>
      <div class="slide-body" style="text-align:center;align-items:center;">
        <div style="font-size:3.6vw;font-weight:900;color:#fff;line-height:1.2;margin-bottom:1vw;text-shadow:0 0 30px rgba(56,189,248,0.55);">${s.title}</div>
        <div style="font-size:2vw;font-weight:800;color:#38bdf8;font-style:italic;margin-bottom:2.5vw;">${s.subtitle}</div>
        <div style="font-size:1.1vw;color:rgba(255,255,255,0.85);background:rgba(0,0,0,0.45);padding:0.6vw 1.6vw;border-radius:30px;border:1px solid rgba(56,189,248,0.4);">${s.note}</div>
      </div>
      <div class="slide-footer">
        <span>工商業光伏 25 年資產決策手冊</span>
        <div class="nav-hints">
          <button class="nav-btn" onclick="next()">開始拷問 ➔</button>
        </div>
      </div>
    `;
    return;
  }

  if (s.type === 'closing') {
    el.innerHTML = `
      <div class="slide-header">
        <span class="slide-tag">${s.tag}</span>
        <span class="brand-logo">MOWINTECH 茂偉低碳</span>
      </div>
      <div class="slide-body">
        <div class="slide-title" style="color:#7dd3fc;font-size:2.8vw;text-align:center;margin-bottom:1.5vw;">${s.title}</div>
        <div style="background:rgba(0,0,0,0.5);border:1.5px solid #38bdf8;border-radius:10px;padding:1.4vw 2vw;box-shadow:0 8px 35px rgba(14,165,233,0.3);">
          <div style="font-size:1.1vw;font-weight:800;letter-spacing:2px;color:#38bdf8;margin-bottom:0.8vw;">⚡ 5 大決策武器清單：</div>
          ${s.weapons.map(w => `<div style="font-size:1.2vw;line-height:1.8;color:#f8fafc;margin-bottom:0.3vw;">• ${w}</div>`).join('')}
        </div>
      </div>
      <div class="slide-footer">
        <span>茂偉低碳 MOWINTECH · 25 年工商業光伏與儲能資產運營專家</span>
        <div class="nav-hints">
          <button class="nav-btn" onclick="prev()">⬅ 上一頁</button>
          <button class="nav-btn" onclick="go(0)">重新放映 ↺</button>
        </div>
      </div>
    `;
    return;
  }

  // 標準靈魂拷問頁面
  el.innerHTML = `
    <div class="slide-header">
      <span class="slide-tag">${s.tag}</span>
      <span class="brand-logo">MOWINTECH 茂偉低碳</span>
    </div>
    <div class="slide-body">
      <div class="slide-title">${s.title}</div>
      <div class="slide-context">${s.context}</div>
      <div class="soul-question-box">
        <div class="soul-label">⚡ 靈魂拷問：</div>
        <div class="soul-text">${s.q}</div>
      </div>
      <div class="answer-zone">
        ${!revealed ? `
          <button class="blank-btn" onclick="reveal()">
            【 點擊揭曉真相 / 或按空白鍵 】
          </button>
        ` : `
          <div class="revealed-answer">
            <div class="ans-title">✅ 財務真相揭曉：</div>
            <div class="ans-content">${s.ans}</div>
            <div style="font-size:1.05vw;color:rgba(255,255,255,0.85);margin-top:0.3vw;">${s.detail}</div>
          </div>
        `}
      </div>
    </div>
    <div class="slide-footer">
      <span>第 ${cur} / ${SLIDES.length - 1} 題</span>
      <div class="nav-hints">
        <button class="nav-btn" onclick="prev()">⬅ 上一頁</button>
        ${!revealed ? `<button class="nav-btn" onclick="reveal()">揭曉答案 👁️</button>` : `<button class="nav-btn" onclick="next()">下一頁 ➔</button>`}
      </div>
    </div>
  `;
}

function reveal() {
  revealed = true;
  render();
}

function next() {
  if (!revealed && SLIDES[cur].type !== 'cover' && SLIDES[cur].type !== 'closing') {
    reveal();
  } else {
    if (cur < SLIDES.length - 1) {
      cur++;
      revealed = false;
      render();
    }
  }
}

function prev() {
  if (cur > 0) {
    cur--;
    revealed = false;
    render();
  }
}

function go(idx) {
  cur = idx;
  revealed = false;
  render();
}

// 鍵盤事件控制
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'PageDown') {
    e.preventDefault();
    next();
  } else if (e.code === 'ArrowLeft' || e.code === 'PageUp') {
    e.preventDefault();
    prev();
  } else if (e.code === 'KeyR' || e.code === 'Enter') {
    e.preventDefault();
    reveal();
  }
});

render();
</script>
</body>
</html>
