<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茂偉低碳 · 工商業光伏 25 年投資「五步靈魂拷問」PPT 簡報</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #02080f;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #stage-wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #02080f;
  }
  .slide-container {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: radial-gradient(circle at 50% 15%, #0369a1 0%, #075985 30%, #0f172a 75%, #020617 100%);
    border: 1.5px solid rgba(56,189,248,0.35);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2.8vw 4.5vw 2.2vw;
    box-shadow: 0 25px 60px rgba(2,6,23,0.9), 0 0 40px rgba(56,189,248,0.15);
    transition: opacity .2s ease;
  }

  /* Header */
  .slide-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 0.8vw;
  }
  .slide-tag {
    font-size: 1.1vw;
    font-weight: 800;
    letter-spacing: 2px;
    color: #38bdf8;
    text-transform: uppercase;
  }
  .slide-tag.ans { color: #34d399; }
  .brand-logo {
    font-size: 1vw;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.6);
  }

  /* Body Layouts */
  .slide-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0.8vw 0;
  }

  /* 1. Myth Big Title Style (Image 1) */
  .myth-title {
    font-size: 3.2vw;
    font-weight: 900;
    line-height: 1.35;
    color: #ffffff;
    padding: 1vw 0;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  /* 2. Soul Question Style (Image 2) */
  .soul-tag-large {
    font-size: 2.2vw;
    font-weight: 900;
    color: #fb923c;
    display: flex;
    align-items: center;
    gap: 0.5vw;
    margin-bottom: 1.2vw;
    text-shadow: 0 0 15px rgba(251,146,60,0.4);
  }
  .soul-card-large {
    background: linear-gradient(135deg, rgba(239,68,68,0.2) 0%, rgba(30,10,20,0.85) 100%);
    border: 2px solid #f87171;
    border-radius: 12px;
    padding: 2vw 2.5vw;
    font-size: 1.8vw;
    font-weight: 800;
    line-height: 1.6;
    color: #ffffff;
    box-shadow: 0 12px 40px rgba(239,68,68,0.25);
  }

  /* 3. Answer Reveal Style */
  .ans-title {
    font-size: 2vw;
    font-weight: 800;
    color: #34d399;
    margin-bottom: 1vw;
  }
  .ans-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.8vw;
    margin-bottom: 0.9vw;
  }
  .ans-card {
    background: rgba(12, 37, 69, 0.85);
    border: 1.2px solid rgba(56,189,248,0.45);
    border-radius: 8px;
    padding: 1vw 1.1vw;
    display: flex;
    flex-direction: column;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .card-h {
    font-size: 1.15vw;
    font-weight: 800;
    color: #fde68a;
    margin-bottom: 0.5vw;
  }
  .card-b {
    font-size: 0.98vw;
    line-height: 1.6;
    color: #cbd5e1;
  }
  .bottom-anchor {
    background: rgba(6, 78, 59, 0.7);
    border: 1.5px solid #34d399;
    border-radius: 8px;
    padding: 0.7vw 1.2vw;
    text-align: center;
    font-size: 1.08vw;
    font-weight: 700;
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(16,185,129,0.2);
  }

  /* Footer & Navigation */
  .slide-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 0.7vw;
    font-size: 0.95vw;
    color: rgba(255,255,255,0.5);
  }
  .nav-hints {
    display: flex;
    gap: 0.8vw;
  }
  .nav-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 0.3vw 0.8vw;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9vw;
    transition: background .2s;
  }
  .nav-btn:hover { background: rgba(56,189,248,0.3); border-color: #38bdf8; }
</style>
</head>
<body>

<div id="stage-wrap">
  <div class="slide-container" id="slide"></div>
</div>

<script>
const QUESTIONS_DATA = [
  {
    tag: '第 01 步 · 材料工程篇',
    num: '第 1 / 5 題',
    myth: '「組件、逆變器都用一樣的，品質應該差不多？」',
    soul: '光伏電站是要承受 25 年暴雨強風的高壓精密發電廠——如果只是把大廠零件買齊、找工班在屋頂拼裝，會留下哪些致命隱患？',
    ansTitle: '【真相】光伏是「25 年精密系統工程」，絕非買零件煮火鍋隨便拼裝！',
    points: [
      { h: '❌ 陷阱 1：組件貓膩', b: '低價施工隊常使用市場上的海退貨、降級 B 規組件充數，外觀看不出差異，但 2~3 年內發電量暴跌 15% 以上！' },
      { h: '❌ 陷阱 2：屋頂穿孔漏水', b: '為省專利夾具成本，直接在彩鋼瓦上「打孔打矽膠」！矽膠 2 年受紫外線老化必開裂滲水，直接毀損廠內昂貴機台與產線！' },
      { h: '❌ 陷阱 3：系統失配與火災', b: '缺乏專業電氣佈局與 MPPT 最佳化，組串失配導致線損高達 10%，接頭發熱甚至引發高壓直流拉弧起火！' }
    ],
    bottom: '🛡️ 茂偉標準：一線原廠 A 規唯一出廠溯源防偽條碼 ＋ 專利鋁鎂鋅無損夾具，承諾 25 年 100% 零漏水！'
  },
  {
    tag: '第 02 步 · 發電數據篇',
    num: '第 2 / 5 題',
    myth: '「宣傳冊上寫年發電 60 萬度，每家預估應該都差不多？」',
    soul: '要客觀驗證廠商承諾的發電效率究竟能不能兌現，如何只用一張電費單，算出最權威的發電硬指標？',
    ansTitle: '【真相】查驗周邊電站真實電網帳單，核算「年度有效發電小時數」！',
    points: [
      { h: '📊 唯一標準：發電有效小時數', b: '計算公式：全年總發電度數 ÷ 裝機容量(kWp)。這是扣除天氣與日照後，最直觀、最容易用電費單核算的硬指標！' },
      { h: '📉 低價劣質系統：約 1,000 小時', b: '次級組件衰減快 ＋ 線損嚴重 ＋ 灰塵遮蔽，500kWp 電站年發僅 50 萬度，25 年累計發電 1,250 萬度。' },
      { h: '📈 茂偉實測電站：超 1,200 小時', b: '出示上海浦東、昆山、蘇州真實電網結算單，年有效小時常年超 1,200 小時（年發 60 萬度），25 年累計多發 250 萬度電！' }
    ],
    bottom: '💰 算術真相：每年多出 200 小時發電 ＝ 500kWp 電站 25 年整整多為工廠產出 250 萬度電！'
  },
  {
    tag: '第 03 步 · 併網時程篇',
    num: '第 3 / 5 題',
    myth: '「反正設備已經在屋頂施工了，晚幾個月併網也沒什麼差？」',
    soul: '很多低價施工隊前期不跑供電局審批變壓器容量，設備上屋頂才卡關。若延遲 3 個月才正式併網通電，工廠帳面上將實質蒸發多少電費？',
    ansTitle: '【真相】延誤 3 個月白白蒸發 13.2 萬！開工第一天把價差全賠光！',
    points: [
      { h: '⏱️ 時間就是真金白銀', b: '500kWp 電站每延誤 1 個月損失 4.4 萬元，延誤 3 個月直接蒸發 13.2 萬，延誤半年損失 26.4 萬！' },
      { h: '⚠️ 供電局絕不賠償', b: '低價 EPC 簽約前不具備電網確信審查能力，變壓器卡關電站淪為屋頂擺設，所有停工損失全由業主承擔！' },
      { h: '✅ 茂偉前期確信審查', b: '簽約前即完成電網荷載與變壓器容量審批，2 年所有項目 100% 於 60~90 天內如期併網交付，鎖定每一分收益！' }
    ],
    bottom: '🚀 茂偉承諾：簽約前確信審查，承諾即確定時程，2 年實績 100% 如期交付！'
  },
  {
    tag: '第 04 步 · 運維真相篇',
    num: '第 4 / 5 題',
    myth: '「每家 EPC 投標都承諾『質保 25 年』，這話到底能不能信？」',
    soul: '25 年質保是組件原廠給的材料保固，原廠不包爬屋頂檢測；施工隊幾年後跑路，第 4 年組件衰減時，誰來幫你向原廠出保？',
    ansTitle: '【真相】茂偉自持 15MW 實體電站 ＋ 每年近千萬現金流，真正保障 25 年！',
    points: [
      { h: '🌞 自持實體電站 15MW', b: '茂偉自身持有並營運多座實體光儲電站，自持容量達 15,000,000 瓦（15MW），自己就是長期電廠業主！' },
      { h: '💰 每年近 1,000 萬現金流', b: '每年擁有將近 10,000,000 元的穩定電費現金流注入，具備源源不絕的資金支撐專職工程運維團隊長青存續！' },
      { h: '🛡️ 專職團隊代辦出保', b: '配備無人機紅外熱像儀 (IR) 與專業 IV 特檢設備，專職工程師爬屋頂代辦原廠索賠換新，讓 25 年質保真正落地！' }
    ],
    bottom: '🔒 唯一真相：唯有自持電站、具備充沛電費現金流的企業，才能保證 25 年不倒閉、電站不淪為孤兒！'
  },
  {
    tag: '第 05 步 · LCOE 算帳篇',
    num: '第 5 / 5 題',
    myth: '「低價 EPC 總價便宜 10 萬，選便宜的性價比最高？」',
    soul: '非貼現 LCOE ＝ 25 年實付總支出 ÷ 25 年累計總發電量。把 25 年維修、發電量與度電成本一次算透後，誰才是真便宜？',
    ansTitle: '【真相】茂偉 25 年總支出反而更便宜（省下 40 萬），度電成本狂降 33.8%！',
    points: [
      { h: '❌ 低價方案（假便宜真燒錢）', b: '初期 110 萬 ＋ 25 年維修 85 萬 ＝ 總支出 195 萬！累計發電 1,250 萬度 ➔ 每度電成本高達 ¥0.1560 元/度！' },
      { h: '✅ 茂偉方案（真省錢高回報）', b: '初期 120 萬 ＋ 25 年運維 35 萬 ＝ 總支出 155 萬！累計發電 1,500 萬度 ➔ 每度電成本僅需 ¥0.1033 元/度！' },
      { h: '🏆 終極財務算術結論', b: '選茂偉 25 年實付總支出反而少掏 40 萬現金！同時多發 250 萬度電，度電成本狂降 33.8%，才是最高性價比！' }
    ],
    bottom: '💡 決策本質：光伏是 25 年生財設備！選茂偉不是買貴，而是 25 年為工廠多賺數百萬現金流！'
  }
];

const SLIDES = [
  { type: 'cover', tag: '茂偉低碳 · 工商業決策學院', title: '讀懂光伏電站投資 —— 25 年真算帳', subtitle: '別被「總價便宜」騙了', note: '按 空白鍵 (Space) 或 右方向鍵 (➔) 進入第一頁' }
];

QUESTIONS_DATA.forEach((q, idx) => {
  // Page A: 迷思標題頁 (Image 1 Style)
  SLIDES.push({ type: 'myth', tag: q.tag, num: q.num, text: q.myth });
  // Page B: 靈魂拷問頁 (Image 2 Style)
  SLIDES.push({ type: 'soul', tag: q.tag, num: q.num, text: q.soul });
  // Page C: 真相揭曉頁
  SLIDES.push({ type: 'answer', tag: q.tag, num: q.num, title: q.ansTitle, points: q.points, bottom: q.bottom });
});

SLIDES.push({
  type: 'closing',
  tag: '結語 · 終極決策',
  title: '「我不再只盯誰總價便宜了。」',
  weapons: [
    '<b>材料工程</b>：一線原廠 A 規防偽 ＋ 專利無損夾具（承諾 25 年 100% 零漏水）',
    '<b>發電實證</b>：實測年度有效發電超 1,200 小時（25 年為工廠多發 250 萬度電）',
    '<b>併網時效</b>：簽約前確信審查（60~90 天確定併網通電，防止 13.2 萬蒸發）',
    '<b>運維閉環</b>：自持 15MW（1500萬瓦）電站 / 年收近千萬現金流（代辦原廠索賠）',
    '<b>LCOE算帳</b>：非貼現度電成本 0.103 元/度（25 年實付總支出反而省下 40 萬）'
  ]
});

let cur = 0;

function render() {
  const s = SLIDES[cur];
  const el = document.getElementById('slide');
  
  if (s.type === 'cover') {
    el.innerHTML = `
      <div class="slide-header">
        <span class="slide-tag">${s.tag}</span>
        <span class="brand-logo">MOWINTECH 茂偉低碳</span>
      </div>
      <div class="slide-body" style="text-align:center;align-items:center;">
        <div style="font-size:3.6vw;font-weight:900;color:#fff;line-height:1.2;margin-bottom:1vw;text-shadow:0 0 30px rgba(56,189,248,0.55);">${s.title}</div>
        <div style="font-size:2vw;font-weight:800;color:#38bdf8;font-style:italic;margin-bottom:2.5vw;">${s.subtitle}</div>
        <div style="font-size:1.1vw;color:rgba(255,255,255,0.85);background:rgba(0,0,0,0.45);padding:0.6vw 1.6vw;border-radius:30px;border:1px solid rgba(56,189,248,0.4);">${s.note}</div>
      </div>
      <div class="slide-footer">
        <span>工商業光伏 25 年資產決策手冊</span>
        <div class="nav-hints"><button class="nav-btn" onclick="next()">開始 ➔</button></div>
      </div>
    `;
    return;
  }

  if (s.type === 'myth') {
    el.innerHTML = `
      <div class="slide-header">
        <span class="slide-tag">${s.tag}</span>
        <span class="brand-logo">MOWINTECH 茂偉低碳</span>
      </div>
      <div class="slide-body">
        <div class="myth-title">${s.text}</div>
      </div>
      <div class="slide-footer">
        <span>${s.num} · 迷思情境</span>
        <div class="nav-hints">
          <button class="nav-btn" onclick="prev()">⬅ 上一頁</button>
          <button class="nav-btn" onclick="next()">靈魂拷問 ➔</button>
        </div>
      </div>
    `;
    return;
  }

  if (s.type === 'soul') {
    el.innerHTML = `
      <div class="slide-header">
        <span class="slide-tag">${s.tag}</span>
        <span class="brand-logo">MOWINTECH 茂偉低碳</span>
      </div>
      <div class="slide-body">
        <div class="soul-tag-large">⚡ 靈魂拷問：</div>
        <div class="soul-card-large">${s.text}</div>
      </div>
      <div class="slide-footer">
        <span>${s.num} · 靈魂拷問</span>
        <div class="nav-hints">
          <button class="nav-btn" onclick="prev()">⬅ 上一頁</button>
          <button class="nav-btn" onclick="next()">真相揭曉 ➔</button>
        </div>
      </div>
    `;
    return;
  }

  if (s.type === 'answer') {
    el.innerHTML = `
      <div class="slide-header">
        <span class="slide-tag ans">${s.tag} · ✅ 真相揭曉</span>
        <span class="brand-logo">MOWINTECH 茂偉低碳</span>
      </div>
      <div class="slide-body">
        <div class="ans-title">${s.title}</div>
        <div class="ans-grid">
          ${s.points.map(p => `
            <div class="ans-card">
              <div class="card-h">${p.h}</div>
              <div class="card-b">${p.b}</div>
            </div>
          `).join('')}
        </div>
        <div class="bottom-anchor">${s.bottom}</div>
      </div>
      <div class="slide-footer">
        <span>${s.num} · 揭曉頁</span>
        <div class="nav-hints">
          <button class="nav-btn" onclick="prev()">⬅ 上一頁</button>
          <button class="nav-btn" onclick="next()">下一題 ➔</button>
        </div>
      </div>
    `;
    return;
  }

  if (s.type === 'closing') {
    el.innerHTML = `
      <div class="slide-header">
        <span class="slide-tag ans">${s.tag} · ✅ 決策宣誓</span>
        <span class="brand-logo">MOWINTECH 茂偉低碳</span>
      </div>
      <div class="slide-body">
        <div style="color:#7dd3fc;font-size:2.8vw;font-weight:900;text-align:center;margin-bottom:1.5vw;">${s.title}</div>
        <div style="background:rgba(0,0,0,0.5);border:1.5px solid #38bdf8;border-radius:10px;padding:1.4vw 2vw;box-shadow:0 8px 35px rgba(14,165,233,0.3);">
          <div style="font-size:1.1vw;font-weight:800;letter-spacing:2px;color:#38bdf8;margin-bottom:0.8vw;">⚡ 5 大決策武器清單：</div>
          ${s.weapons.map(w => `<div style="font-size:1.18vw;line-height:1.8;color:#f8fafc;margin-bottom:0.3vw;">• ${w}</div>`).join('')}
        </div>
      </div>
      <div class="slide-footer">
        <span>結語宣誓 · 茂偉低碳 MOWINTECH</span>
        <div class="nav-hints">
          <button class="nav-btn" onclick="prev()">⬅ 上一頁</button>
          <button class="nav-btn" onclick="go(0)">重新放映 ↺</button>
        </div>
      </div>
    `;
    return;
  }
}

function next() { if (cur < SLIDES.length - 1) { cur++; render(); } }
function prev() { if (cur > 0) { cur--; render(); } }
function go(idx) { cur = idx; render(); }

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'PageDown' || e.code === 'Enter') {
    e.preventDefault(); next();
  } else if (e.code === 'ArrowLeft' || e.code === 'PageUp') {
    e.preventDefault(); prev();
  }
});

render();
</script>
</body>
</html>
