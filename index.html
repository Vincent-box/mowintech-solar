<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>讀懂光伏電站投資（25年資產與LCOE真算帳）· 茂偉低碳 MOWINTECH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%;
      font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background: #000;
      color: #fff;
    }
    .scene {
      width: 100%; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; padding: 3rem 1.5rem;
    }
    /* 天空色調 (Yoda 漸層風格) */
    .sky-start { background: linear-gradient(180deg, #061727 0%, #0c2b3d 45%, #134e4a 100%); }
    .sky-dawn { background: linear-gradient(180deg, #091e2b, #064e3b 55%, #059669); }
    .sky-solar { background: linear-gradient(180deg, #0a1f33, #0f4c5c 45%, #e36414); }
    .sky-noon { background: linear-gradient(180deg, #064e3b, #047857 50%, #10b981); }
    .sky-valley { background: linear-gradient(180deg, #0f172a, #1e293b 42%, #334155); }
    .sky-storm { background: linear-gradient(180deg, #0b0f19, #1e1b4b 50%, #4338ca); }
    .sky-clear { background: linear-gradient(180deg, #062c43, #05668d 44%, #028090 82%, #00a896); }
    .sky-result { background: linear-gradient(180deg, #061727, #064e3b 42%, #059669); }

    /* 水墨/屋頂幾何剪影 */
    .ink-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 160px; pointer-events: none; }
    .overlay { position: relative; z-index: 10; text-align: center; max-width: 640px; width: 100%; }

    .t-main { color: #f2f5ff; }
    .t-sub { color: rgba(228, 234, 247, 0.88); }
    .t-label { color: rgba(205, 214, 236, 0.6); }
    .sky-dawn .t-main, .sky-start .t-main { color: #fff7e6; }
    .sky-dawn .t-sub, .sky-start .t-sub { color: rgba(255, 242, 214, 0.85); }

    .chapter-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 0.5rem; color: #34d399; }
    .chapter-title { font-size: 26px; font-weight: 300; margin-bottom: 1rem; line-height: 1.3; letter-spacing: 0.5px; }
    .chapter-quote { font-size: 15px; line-height: 1.95; margin-bottom: 2rem; font-style: italic; max-width: 480px; margin: 0 auto 2rem; }

    .round-q { font-size: 16px; font-weight: 500; margin-bottom: 1.3rem; line-height: 1.5; color: #fff; }
    .transition-quote { font-size: 17px; max-width: 460px; line-height: 2.1; font-style: italic; color: rgba(216, 228, 255, 0.9); margin: 0 auto 1.5rem; }

    .choices { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 480px; margin: 0 auto; }
    .choice-btn {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      padding: 0.95rem 1.25rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
      transition: all .2s;
      backdrop-filter: blur(8px);
    }
    .choice-btn:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(52, 211, 153, 0.7);
      transform: translateX(4px);
    }

    .continue-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: rgba(255, 255, 255, 0.85);
      padding: 0.65rem 2.2rem;
      border-radius: 6px;
      cursor: pointer;

      margin-top: 1.3rem;
      letter-spacing: 1px;
      transition: all .2s;
    }
    .continue-btn:hover { border-color: #34d399; color: #fff; background: rgba(16, 185, 129, 0.25); }

    .feedback { font-size: 13.5px; line-height: 1.8; max-width: 460px; margin: 0.7rem auto 0; min-height: 42px; text-align: left; }

    /* 儀表滑桿 (Gauge) */
    .gauge-wrap { max-width: 340px; margin: 0 auto; }
    input[type=range].gsl {
      width: 100%; -webkit-appearance: none; appearance: none;
      background: transparent; height: 22px; margin-top: 0.4rem;
    }
    input[type=range].gsl::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: #10b981; cursor: pointer; margin-top: -7px; box-shadow: 0 1px 6px rgba(0,0,0,.5); border: 2px solid #fff;
    }
    input[type=range].gsl::-webkit-slider-runnable-track {
      height: 8px; border-radius: 4px; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
    }
    .gsl-ends { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 0.3rem; }

    /* 分類 (Classify) */
    .cls-list { max-width: 480px; margin: 0 auto 0.8rem; display: flex; flex-direction: column; gap: 0.55rem; }
    .cls-row {
      display: flex; align-items: center; gap: 0.6rem;
      background: rgba(0, 0, 0, 0.32); border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px; padding: 0.55rem 0.75rem; flex-wrap: wrap; text-align: left;
    }
    .cls-name { flex: 1; font-size: 13px; color: #fff; line-height: 1.5; min-width: 100%; margin-bottom: 0.35rem; }
    .cls-btns { display: flex; gap: 0.4rem; width: 100%; }
    .cls-btn {
      border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); color: #fff;
      border-radius: 6px; padding: 0.4rem 0.8rem; font-size: 12px; cursor: pointer; transition: all .15s; flex: 1;
    }
    .cls-btn.trap.on { background: rgba(239, 68, 68, 0.35); border-color: #ef4444; }
    .cls-btn.safe.on { background: rgba(16, 185, 129, 0.35); border-color: #10b981; }
    .cls-row.right { border-color: rgba(52, 211, 153, 0.8); }
    .cls-row.wrong { border-color: rgba(248, 113, 113, 0.8); }

    /* 進度條與頂部 */
    .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #10b981, #34d399); transition: width .4s; z-index: 100; }
    .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .step-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.25); }
    .step-dots i.on { background: #34d399; box-shadow: 0 0 8px #34d399; }

    .data-chip {
      display: inline-block; background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(52, 211, 153, 0.4); border-radius: 6px;
      padding: 2px 8px; margin: 2px; font-size: 12px; color: #6ee7b7;
    }

    .yoda-btn {
      display: inline-block; background: linear-gradient(135deg, #059669, #10b981);
      color: #fff; padding: 0.85rem 2.2rem; border-radius: 8px; font-size: 14px;
      cursor: pointer; text-decoration: none; margin: 0.3rem; transition: opacity .2s; font-weight: 600;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); border: none;
    }
    .yoda-btn:hover { opacity: .9; }
    .yoda-btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>

<div class="progress-bar" id="progress"></div>
<div id="game"></div>

<script>
const G = document.getElementById('game'), PB = document.getElementById('progress');

// ===== SVG 背景幾何 (山巒/工廠/光伏陣列屋頂) =====
const MOTIFS = {
  farhills: (f, n, l) => `<path d="M0,70 C120,50 220,58 340,44 C460,32 560,52 700,40 C840,30 960,50 1080,42 L1200,46 L1200,120 L0,120Z" fill="${f}"/><path d="M0,86 C160,74 300,82 460,70 C640,58 780,76 940,68 C1060,62 1140,72 1200,70 L1200,120 L0,120Z" fill="${n}"/><path d="M0,70 C120,50 220,58 340,44 C460,32 560,52 700,40 C840,30 960,50 1080,42 L1200,46" fill="none" stroke="${l}" stroke-width="1.4"/>`,
  rooftop: (f, n, l) => `<path d="M0,90 L200,45 L400,90 L600,45 L800,90 L1000,45 L1200,90 L1200,120 L0,120Z" fill="${f}"/><path d="M0,105 L200,60 L400,105 L600,60 L800,105 L1000,60 L1200,105 L1200,120 L0,120Z" fill="${n}"/><path d="M0,90 L200,45 L400,90 L600,45 L800,90 L1000,45 L1200,90" fill="none" stroke="${l}" stroke-width="1.5" opacity="0.6"/>`,
  grid: (f, n, l) => `<path d="M0,80 C300,60 600,70 1200,65 L1200,120 L0,120Z" fill="${f}"/><line x1="200" y1="20" x2="200" y2="80" stroke="${l}" stroke-width="2"/><line x1="600" y1="10" x2="600" y2="70" stroke="${l}" stroke-width="2"/><line x1="1000" y1="25" x2="1000" y2="80" stroke="${l}" stroke-width="2"/><path d="M200,20 Q400,45 600,10 Q800,45 1000,25" fill="none" stroke="${l}" stroke-width="1.2" opacity="0.7"/>`
};

function inkCols(sky) {
  return ['rgba(16, 185, 129, 0.12)', 'rgba(6, 78, 59, 0.35)', 'rgba(52, 211, 153, 0.45)'];
}

function bg(type, sky) {
  const m = MOTIFS[type] || MOTIFS.farhills;
  const [f, n, l] = inkCols(sky);
  return `<svg class="ink-bg" viewBox="0 0 1200 120" preserveAspectRatio="none">${m(f, n, l)}</svg>`;
}

// ===== 開場序言 (Opening) =====
const OPENING = {
  sky: 'sky-dawn', bg: 'rooftop', label: '序 · 破除迷思', title: '一堆報價單，你只抓了每瓦幾塊錢',
  quotes: [
    '你打開光伏 EPC 報價單——組件規格、逆變器、每瓦單價…<br>你多半只看「誰總價便宜 10 萬」，然後就想拍板。',
    '但工商業光伏最容易騙人的，就是<b>只看一次性建置費（Capex）</b>。<br>光伏電站是要為工廠運轉 <b>25 年的微型發電廠</b>——<br>少看 <b>LCOE、發電實績、併網時程與孤兒電站風險</b>，<br>省下的 10 萬，會以 50 萬維修費與漏水停工代價還回去。'
  ]
};

// ===== 5 大核心關卡 (5 Rounds) =====
const ROUNDS = [
  // Round 1: 材料工程篇 (情境題：兩份報價單差在哪？)
  {
    type: 'ab', sky: 'sky-valley', bg: 'rooftop', label: '第 01 段 · 材料工程篇', title: '兩份 500kWp 報價單放在桌上，到底差在哪？',
    text: '你收到兩份工商業屋頂光伏報價單：<br><b>方案 A</b> 總價便宜 10 萬元，規格表簡略標註「一線高效組件、標準鍍鋅支架」；<br><b>方案 B</b> 標明「一線原廠 A 規唯一出廠防偽條碼、工商業專利無損夾具與結構荷載驗算」。<br><span style="font-size:12px;opacity:.85">（廠房屋頂要承受 25 年暴雨強風，兩者的差距往往隱藏在看不見的細節）</span>'
      + '<svg viewBox="0 0 300 110" style="width:100%;max-width:280px;margin:0.6rem auto;display:block">'
      + '<rect x="20" y="20" width="115" height="70" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)"/>'
      + '<text x="77" y="45" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">方案 A (低價方案)</text>'
      + '<text x="77" y="65" fill="rgba(255,255,255,0.7)" font-size="9" text-anchor="middle">便宜 10 萬 · 通用打膠安裝</text>'
      + '<rect x="165" y="20" width="115" height="70" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)"/>'
      + '<text x="222" y="45" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">方案 B (茂偉標準)</text>'
      + '<text x="222" y="65" fill="rgba(255,255,255,0.7)" font-size="9" text-anchor="middle">原廠防偽 · 專利無損夾具</text>'
      + '</svg>',
    q: '在光伏工程領域，便宜 10 萬元的低價方案通常在哪些看不見的地方省成本？',
    choices: [
      '選用海退貨/B規次級組件充數 ＋ 屋頂粗暴打孔穿透防水層（埋下熱斑衰減與廠房漏水隱患）',
      '廠商單純薄利多銷，材料規格與施工工藝跟大廠標準完全一樣無差別',
      '省在施工隊的管理成本，設備與防水壽命沒有任何影響'
    ],
    correct: 0,
    fb: [
      '<b>直擊本質！便宜 10 萬的代價是 25 年的隱患。</b> 低價 EPC 常使用次級海退組件（2~3年發電衰減15%以上），且缺乏針對性防水夾具，等暴雨漏水導致廠內設備受損，損失遠超當初省下的差價！茂偉堅持原廠 A 規溯源 ＋ 專利無損夾具，承諾 100% 零漏水。',
      '商業迷思！光伏硬體成本極為透明，便宜 10 萬絕不可能靠「薄利多銷」填補，必然在組件等級（B規/海退）與防水防腐結構上嚴重縮水。',
      '光伏是 25 年高壓發電工程，粗暴拼裝與省工省料會在 3~5 年後帶來巨大的維修黑洞。'
    ]
  },

  // Round 2: 發電數據篇 (情境題：宣傳冊上的發電量能信嗎？)
  {
    type: 'ab', sky: 'sky-solar', bg: 'farhills', label: '第 02 段 · 發電數據篇', title: '宣傳冊寫年發電 60 萬度，如何判斷是不是畫大餅？',
    text: '評估電站效益時，每家廠商宣傳手冊上都印著漂亮的「理論發電量預估」。<br>但在光伏工程領域，決定發電效率的客觀金標準是 <b>PR 值（系統性能比）</b>——扣除天氣輻照度後，系統實際發出的電量比例。<br><span style="font-size:12px;opacity:.85">（同一個 500kWp 屋頂，PR 74% 與 PR 82.5% 在 25 年裡整整差了 250 萬度電！）</span>'
      + '<svg viewBox="0 0 280 110" style="width:100%;max-width:260px;margin:0.6rem auto;display:block">'
      + '<line x1="30" y1="75" x2="250" y2="75" stroke="rgba(255,255,255,0.3)"/>'
      + '<text x="30" y="95" fill="rgba(255,255,255,0.5)" font-size="9">PR 70% (劣質)</text>'
      + '<text x="140" y="95" fill="rgba(255,255,255,0.5)" font-size="9" text-anchor="middle">PR 78% (平均)</text>'
      + '<text x="250" y="95" fill="#34d399" font-size="9" text-anchor="end">PR 82.8% (頂級)</text>'
      + '<circle cx="50" cy="75" r="5" fill="#ef4444"/>'
      + '<circle cx="235" cy="75" r="6" fill="#34d399"/>'
      + '<text x="140" y="40" fill="#fff" font-size="10" text-anchor="middle">PR 差距 8% = 25 年發電量差距 250 萬度</text>'
      + '</svg>',
    q: '要客觀驗證廠商承諾的發電效率究竟能不能兌現，最權威的依據是？',
    choices: [
      '查看廠商宣傳手冊上的理論預估表與業務員的口頭保證',
      '查驗廠商在同氣候周邊電站的「真實電網結算帳單」與即時 PR 監控紀錄',
      '等電站建完併網運轉 3 年後再來對帳看發電量'
    ],
    correct: 1,
    fb: [
      '口頭承諾與宣傳冊無任何法律效力，許多低價 EPC 併網後因線損與組件衰減，實測 PR 往往低於 75%。',
      '<b>對！真實帳單與 PR 監控不會騙人。</b> 茂偉出示上海浦東（茂強森）、昆山（茂威）、蘇州（茂昆正）等真實電網結算單，實測 PR 常年達 81.5%~83%，月達成率高於 103%，用周邊真實數據證明 25 年多發 250 萬度電！',
      '光伏電站一旦建好，低發電量的損失將持續 25 年無法逆轉，簽約前必須以實測數據核驗。'
    ]
  },

  // Round 3: 併網時程篇 (拖延 3 個月損失試算) - Gauge 滑桿
  {
    type: 'gauge', sky: 'sky-storm', bg: 'grid', label: '第 03 段 · 併網時程篇', title: '差 3 個月併網，損失到底有多大？',
    text: '500kWp 電站每月發電約 <b>5.5 萬度</b>（按電價 0.8 元/度計約 <b>4.4 萬元</b>）。<br>低價隊因前期不審核電網容量，卡關延誤 3 個月，工廠白白損失 <b>13.2 萬元電費</b>！<br>茂偉簽約前即完成電網審查，<b>2 年實際項目 100% 如期 60~90 天併網</b>。',
    q: '滑動滑桿：預估延誤 1~6 個月，你認為電費損失有多大？（請拖動至 3 個月損失約 13 萬）',
    left: '延遲1月 (4.4萬)', right: '延遲6月 (26.4萬)', ans: 50,
    correct: v => v >= 40 && v <= 60,
    fb: v => v < 40
      ? '損失低估了！延誤 3 個月就直接蒸發 13 萬以上，直接把低價 EPC 省的 10 萬全部賠光！'
      : v > 60
      ? '延誤半年損失超過 26 萬！茂偉前期確信審批，承諾時間即為確定併網時程。'
      : '<b>完全正確！延遲 3 個月 = 13.2 萬元直接蒸發！</b> 低價 EPC 雖然便宜 10 萬，但併網一卡關，省下的錢在第一天就賠光倒貼！茂偉 100% 如期交付才是真保障。'
  },

  // Round 4: 運維真相篇 (組件廠保固 25 年 vs EPC 跑路無人出保)
  {
    type: 'ab', sky: 'sky-valley', bg: 'rooftop', label: '第 04 段 · 運維真相篇', title: '組件廠保固 25 年，EPC 跑路了你找誰出保？',
    text: '光伏行業最大的認知誤區：<b>25 年質保是「組件原廠」給的，EPC 施工隊根本不保 25 年！</b><br>當第 4 年組件出現隱裂、熱斑發電暴跌時，低價 EPC 早就註銷解散了。<br>原廠要求你提供：<b>IV 特性曲線報告、EL 熱成像數據、自行拆卸並寄回原廠</b>。<br><span class="data-chip">原廠只保材料不包爬屋頂</span><span class="data-chip">需專業 IV / IR 檢測報告</span><span class="data-chip">茂偉代辦原廠索賠</span>'
      + '<svg viewBox="0 0 300 130" style="width:100%;max-width:280px;margin:0.6rem auto;display:block">'
      + '<rect x="15" y="15" width="120" height="95" rx="6" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-dasharray="3 3"/>'
      + '<text x="75" y="38" fill="#f87171" font-size="10.5" font-weight="bold" text-anchor="middle">❌ 低價 EPC 跑路後</text>'
      + '<text x="75" y="58" fill="rgba(255,255,255,0.8)" font-size="8.5" text-anchor="middle">原廠：「請提供檢測報告並自拆」</text>'
      + '<text x="75" y="74" fill="rgba(255,255,255,0.5)" font-size="8" text-anchor="middle">業主無儀器、無人修</text>'

// 儀表滑桿 (Gauge SVG)
function gaugeSVG(val, leftLbl, rightLbl) {
  const min = 0, max = 100, f = v => Math.PI * (1 - (v - min) / (max - min)), R = 120, ax = 250 + R * Math.cos(f(val)), ay = 170 - R * Math.sin(f(val));
  return `<svg viewBox="0 0 500 200" style="width:100%;max-width:320px">
    <path d="M130,170 A120,120 0 0,1 370,170" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="14"/>
    <line x1="250" y1="170" x2="${ax}" y2="${ay}" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <circle cx="250" cy="170" r="9" fill="#10b981"/>
    <text x="250" y="128" fill="#fff" font-size="24" font-weight="600" text-anchor="middle">延遲約 3 個月</text>
    <text x="130" y="192" fill="#34d399" font-size="11" text-anchor="middle">${leftLbl}</text>
    <text x="370" y="192" fill="#f87171" font-size="11" text-anchor="middle">${rightLbl}</text>
  </svg>`;
}

function renderGauge(i) {
  const r = ROUNDS[i]; state.gv = 50;
  function draw() {
    G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div>
      <div class="gauge-wrap">${gaugeSVG(state.gv, r.left, r.right)}
      <input type="range" class="gsl" min="0" max="100" value="${state.gv}" oninput="state.gv=parseInt(this.value);drawGauge()">
      <div class="gsl-ends"><span>${r.left}</span><span>${r.right}</span></div></div>
      <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-top:0.8rem">
        <button class="continue-btn" onclick="gaugeDone(${i})">確認評估 ›</button>
        <button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">看解析</button>
      </div>`);
  }
  window.drawGauge = draw; draw();
}

function gaugeDone(i) {
  const r = ROUNDS[i]; if (r.correct(state.gv)) state.score++;
  G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}
    <div class="gauge-wrap">${gaugeSVG(state.gv, r.left, r.right)}
    <div class="feedback" style="margin-top:0.8rem;color:#34d399">${r.fb(state.gv)}</div></div>
    <button class="continue-btn" onclick="record(${i})">繼續 ›</button>`);
}

function renderAB(i) {
  const r = ROUNDS[i];
  G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div>

}

function abPick(i, k) {
  const r = ROUNDS[i]; if (k === r.correct) state.score++;
  const col = k === r.correct ? '#34d399' : '#fcd34d';
  G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}
    <div class="feedback" style="color:${col};min-height:auto;font-size:14px">${r.fb[k]}</div>
    <button class="continue-btn" onclick="record(${i})">繼續 ›</button>`);
}

// 分類題型 (Classify)
function renderClassify(i) {
  const r = ROUNDS[i];
  if (state.cls.length !== r.items.length) state.cls = r.items.map(() => null);
  function draw() {
    const rows = r.items.map((it, k) => `<div class="cls-row" id="cr${k}">
      <div class="cls-name">${it[0]}</div>
      <div class="cls-btns">
        <button class="cls-btn trap ${state.cls[k]==='atk'?'on':''}" onclick="setCls(${k},'atk')">${r.catA}</button>
        <button class="cls-btn safe ${state.cls[k]==='def'?'on':''}" onclick="setCls(${k},'def')">${r.catB}</button>
      </div></div>`).join('');
    const done = state.cls.every(x => x !== null);
    G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div>
      <div class="cls-list">${rows}</div>
      <div class="feedback" id="fbc" style="min-height:24px"></div>
      <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap">
        ${done ? `<button class="continue-btn" onclick="clsCheck(${i})">檢查判斷</button>` : ''}
        <button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">看解析</button>
      </div>`);
  }
  window.drawCls = draw; draw();
}

function setCls(k, v) { state.cls[k] = v; window.drawCls(); }
function clsCheck(i) {
  const r = ROUNDS[i]; let ok = 0;
  r.items.forEach((it, k) => {
    const row = document.getElementById('cr' + k);
    const right = state.cls[k] === it[1];
    if (right) ok++;
    row.classList.add(right ? 'right' : 'wrong');
  });
  if (ok >= r.items.length - 1) state.score++;
  document.getElementById('fbc').innerHTML = `<span style="color:${ok===r.items.length?'#34d399':'#fcd34d'}">正確判斷 ${ok}/${r.items.length}。${r.reveal}</span>`;
  const cb = G.querySelector('.continue-btn');
  if (cb) cb.parentElement.outerHTML = `<button class="continue-btn" onclick="record(${i})">繼續 ›</button>`;
}

function record(i) {
  const t = TRANSITIONS[i];
  if (t) fade(() => showTrans(t, i));
  else advance(i);
}

function showTrans(txt, i) {
  G.innerHTML = `<div class="scene" style="background:linear-gradient(180deg,#061727,#064e3b 55%,#047857);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem">

      <button class="continue-btn" onclick="advance(${i})">繼續 ›</button>
    </div></div>`;
}

function advance(i) {
  const n = i + 1;
  if (n >= ROUNDS.length) fade(showResult);

}

    + '<div class="t-sub" style="font-size:12.5px;margin-bottom:0.8rem;opacity:0.85">同一張光伏報價單，你已經具備穿透 25 年真相的判斷力</div>'
    + '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem">'
    + TOOLBOX.map(t => '<div style="background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.14);border-radius:9px;padding:0.45rem 0.3rem">'
      + '<div style="width:100%;max-width:70px;margin:0 auto">' + t[1] + '</div>'
      + '<div style="font-size:10.5px;color:rgba(255,255,255,0.85);margin-top:0.2rem;line-height:1.3">' + t[0] + '</div></div>').join('')
    + '</div></div>';
}

function showResult() {
  PB.style.width = '100%';
  const s = state.score, mx = ROUNDS.length;
  const tier = s >= 4 ? '資深工商業決策專家' : '明智決策者';

  G.innerHTML = scene('sky-result', 'rooftop', `
    <div class="chapter-label" style="margin-bottom:0.6rem">診斷通關 · 25 年決策完成</div>
    <div style="font-size:44px;margin-bottom:0.3rem">⚡</div>
    <div class="chapter-title t-main" style="font-size:24px;margin-bottom:0.2rem">你已完全掌握光伏投資的真算帳</div>
    <div style="font-size:19px;font-weight:800;color:#6ee7b7;margin:0.4rem auto 0.8rem;max-width:440px;text-shadow:0 1px 3px rgba(0,0,0,.6)">
      「我不再只盯誰初始建置費便宜 10 萬了。」
    </div>
    <div class="round-text t-sub" style="font-size:13.5px;line-height:1.8;max-width:480px">
      你剛穿透了 5 大關卡：<br>
      <b>材料系統工程 → 周邊發電實證 → 併網時效防延誤 → 自持運維代出保 (抗孤兒電站) → 非貼現 LCOE (0.103元/度)</b>。<br><br>
      <b>終極結論</b>：茂偉 120 萬 vs 低價 110 萬，25 年實付總成本<b>反而省下 40 萬</b>（155萬 vs 195萬），多發 <b>250 萬度電</b>，度電成本<b>狂降 33.8%</b>！<br><br>
      決策評估得分：<b>${s} / ${mx}（${tier}）</b>
    </div>
    ${toolboxHTML()}
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.65rem;max-width:360px;margin:0 auto">
      <a class="yoda-btn" style="width:100%;box-sizing:border-box" href="javascript:void(0)" onclick="alert('已為您登記！茂偉低碳工程團隊將為貴公司提供免費工商業屋頂結構與 25 年 LCOE 試算！')">預約茂偉工程師現場免費屋頂勘查 →</a>
      <button class="yoda-btn ghost" style="width:100%;box-sizing:border-box;margin:0" onclick="restart()">重新測驗一次</button>
    </div>
    <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:1.5rem">茂偉低碳 MOWINTECH · 25 年工商業光伏與儲能資產運營專家</div>`);
}

function restart() {
  state = { idx: -1, score: 0, gv: 50, cls: [] };
  oi = 0; PB.style.width = '0%';
  fade(showStart);
}

// Global Exports
['startOpening', 'nextOpening', 'showRound', 'renderGauge', 'gaugeDone', 'setCls', 'clsCheck', 'giveAnswer', 'abPick', 'record', 'advance', 'showResult', 'restart', 'fade', 'renderClassify', 'renderAB'].forEach(n => window[n] = eval(n));
window.state = state;

showStart();
</script>
</body>
</html>
