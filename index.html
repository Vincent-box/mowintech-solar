  return ['rgba(16, 185, 129, 0.12)', 'rgba(6, 78, 59, 0.35)', 'rgba(52, 211, 153, 0.45)'];
}

function bg(type, sky) {
  const m = MOTIFS[type] || MOTIFS.farhills;
  const [f, n, l] = inkCols(sky);
  return `<svg class="ink-bg" viewBox="0 0 1200 120" preserveAspectRatio="none">${m(f, n, l)}</svg>`;

function giveAnswer(i) {
  const r = ROUNDS[i], a = ANS[i];
  const gloss = `<div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.5);margin:0.85rem 0 0.5rem">名詞白話</div>`

  const box = inner => `<div style="max-width:480px;margin:0.5rem auto 0;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.28);border-radius:10px;padding:1rem 1.2rem;backdrop-filter:blur(8px)">${inner}</div>`;
  const ansLine = `<div style="font-size:14px;line-height:1.7;color:#fff;text-align:left"><b style="color:#34d399">答案：</b>${a.answer}</div>`;

  if (r.type === 'classify') {
    r.items.forEach((it, k) => state.cls[k] = it[1]);
    const rows = r.items.map(it => `<div class="cls-row right"><div class="cls-name">${it[0]}</div><div class="cls-btns"><button class="cls-btn ${it[1]} on" disabled>${it[1]==='atk'?r.catA:r.catB}</button></div></div>`).join('');
    G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div><div class="cls-list">${rows}</div>${box(ansLine + `<div style="font-size:13px;line-height:1.7;color:rgba(255,255,255,0.86);margin-top:0.55rem;text-align:left">${r.reveal}</div>` + gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
  } else if (r.type === 'gauge') {
    G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}<div class="gauge-wrap">${gaugeSVG(r.ans, r.left, r.right)}<div class="feedback" style="margin-top:0.6rem">${r.fb(r.ans)}</div></div>${box(ansLine + gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
  } else {
    const ch = r.choices.map((c, k) => `<div class="choice-btn" style="cursor:default;${k===r.correct?'border-color:#34d399;background:rgba(16,185,129,0.25)':'opacity:0.45'}">${k===r.correct?'✓ ':''}${c}</div>`).join('');
    G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}<div class="choices">${ch}</div><div class="feedback" style="color:#34d399;min-height:auto;font-size:14px">${r.fb[r.correct]}</div>${box(gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
  }
}

function prog() { PB.style.width = (Math.max(0, state.idx + 1) / ROUNDS.length * 100) + '%'; }
function dots(i) { return `<div class="step-dots">${ROUNDS.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>`; }
function fade(fn) { G.style.transition = 'opacity .28s'; G.style.opacity = '0'; setTimeout(() => { fn(); G.style.opacity = '1'; }, 290); }
function scene(sky, bgtype, inner) { return `<div class="scene ${sky}">${bg(bgtype, sky)}<div class="overlay">${inner}</div></div>`; }

function head(r) {
  return `<div class="chapter-label">${r.label}</div><div class="chapter-title t-main">${r.title}</div><div class="round-text t-sub">${r.text}</div>`;
}

  const q = OPENING.quotes[oi], last = oi >= OPENING.quotes.length - 1;

function showRound(i) {
  state.idx = i; prog(); const r = ROUNDS[i];
  if (r.type === 'gauge') renderGauge(i);
  else if (r.type === 'classify') renderClassify(i);
  else renderAB(i);
}

// 儀表滑桿 (Gauge SVG)
function gaugeSVG(val, leftLbl, rightLbl) {
  const min = 0, max = 100, f = v => Math.PI * (1 - (v - min) / (max - min)), R = 120, ax = 250 + R * Math.cos(f(val)), ay = 170 - R * Math.sin(f(val));
  return `<svg viewBox="0 0 500 200" style="width:100%;max-width:320px">
    <path d="M130,170 A120,120 0 0,1 370,170" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="14"/>
    <line x1="250" y1="170" x2="${ax}" y2="${ay}" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <circle cx="250" cy="170" r="9" fill="#10b981"/>
    <text x="250" y="128" fill="#fff" font-size="24" font-weight="600" text-anchor="middle">延遲約 3 個月</text>
    <text x="130" y="192" fill="#34d399" font-size="11" text-anchor="middle">${leftLbl}</text>
    <text x="370" y="192" fill="#f87171" font-size="11" text-anchor="middle">${rightLbl}</text>
  </svg>`;
}

function renderGauge(i) {
  const r = ROUNDS[i]; state.gv = 50;
  function draw() {
    G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div>
      <div class="gauge-wrap">${gaugeSVG(state.gv, r.left, r.right)}
      <input type="range" class="gsl" min="0" max="100" value="${state.gv}" oninput="state.gv=parseInt(this.value);drawGauge()">
      <div class="gsl-ends"><span>${r.left}</span><span>${r.right}</span></div></div>
      <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-top:0.8rem">
        <button class="continue-btn" onclick="gaugeDone(${i})">確認評估 ›</button>
        <button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">看解析</button>
      </div>`);
  }
  window.drawGauge = draw; draw();
}

function gaugeDone(i) {
  const r = ROUNDS[i];
  const isOk = r.correct(state.gv);
  if (isOk) state.score++;
  
  const col = isOk ? '#34d399' : '#fcd34d';
  const actionBtn = isOk
    ? `<button class="continue-btn" style="border-color:#34d399;color:#6ee7b7" onclick="record(${i})">估算精準，繼續 ›</button>`
    : `<button class="continue-btn" style="border-color:#f87171;color:#fca5a5" onclick="renderGauge(${i})">估算有偏差，重新調整滑桿 ↺</button>`;

  G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}
    <div class="gauge-wrap">${gaugeSVG(state.gv, r.left, r.right)}
    <div class="feedback" style="margin-top:0.8rem;color:${col}">${r.fb(state.gv)}</div></div>
    ${actionBtn}`);
}

// 二選一 / 三選一 (AB)
function renderAB(i) {

}

function abPick(i, k) {

  G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}
    <div class="feedback" style="color:${col};min-height:auto;font-size:14px;background:rgba(0,0,0,0.3);padding:1rem 1.2rem;border-radius:10px;border:1px solid ${isCorrect?'rgba(52,211,153,0.4)':'rgba(239,68,68,0.4)'}">
      ${isCorrect ? '<b>✅ 恭喜答對！</b><br>' : '<b>⚠️ 答案不對喔！這是常見的商業陷阱：</b><br>'}${r.fb[k]}
    </div>
    ${actionBtn}`);
}

// 分類題型 (Classify)
function renderClassify(i) {
  const r = ROUNDS[i];
  if (state.cls.length !== r.items.length) state.cls = r.items.map(() => null);
  function draw() {
    const rows = r.items.map((it, k) => `<div class="cls-row" id="cr${k}">
      <div class="cls-name">${it[0]}</div>
      <div class="cls-btns">
        <button class="cls-btn trap ${state.cls[k]==='atk'?'on':''}" onclick="setCls(${k},'atk')">${r.catA}</button>
        <button class="cls-btn safe ${state.cls[k]==='def'?'on':''}" onclick="setCls(${k},'def')">${r.catB}</button>
      </div></div>`).join('');
    const done = state.cls.every(x => x !== null);
    G.innerHTML = scene(r.sky, r.bg, `${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div>
      <div class="cls-list">${rows}</div>
      <div class="feedback" id="fbc" style="min-height:24px"></div>
      <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap">
        ${done ? `<button class="continue-btn" onclick="clsCheck(${i})">檢查判斷</button>` : ''}
        <button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">看解析</button>
      </div>`);
  }
  window.drawCls = draw; draw();
}

function setCls(k, v) { state.cls[k] = v; window.drawCls(); }
function clsCheck(i) {
  const r = ROUNDS[i]; let ok = 0;
  r.items.forEach((it, k) => {
    const row = document.getElementById('cr' + k);
    const right = state.cls[k] === it[1];
    if (right) ok++;
    row.classList.add(right ? 'right' : 'wrong');
  });
  if (ok >= r.items.length - 1) state.score++;
  document.getElementById('fbc').innerHTML = `<span style="color:${ok===r.items.length?'#34d399':'#fcd34d'}">正確判斷 ${ok}/${r.items.length}。${r.reveal}</span>`;
  const cb = G.querySelector('.continue-btn');
  if (cb) cb.parentElement.outerHTML = `<button class="continue-btn" onclick="record(${i})">繼續 ›</button>`;
}

function record(i) {
  const t = TRANSITIONS[i];
  if (t) fade(() => showTrans(t, i));
  else advance(i);
}

function showTrans(txt, i) {
  G.innerHTML = `<div class="scene" style="background:linear-gradient(180deg,#061727,#064e3b 55%,#047857);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem">
    <div class="overlay">
      <div class="transition-quote">${txt}</div>
      <button class="continue-btn" onclick="advance(${i})">繼續 ›</button>
    </div></div>`;
}

function advance(i) {
  const n = i + 1;
  if (n >= ROUNDS.length) fade(showResult);
  else fade(() => showRound(n));
}

function showResult() {

      <b>終極結論</b>：茂偉 120 萬 vs 低價 110 萬，25 年實付總成本<b>反而省下 40 萬</b>（155萬 vs 195萬），多發 <b>250 萬度電</b>，度電成本<b>狂降 33.8%</b>！<br><br>
      決策評估得分：<b>${s} / ${mx}（${tier}）</b>
    </div>
    ${toolboxHTML()}
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.65rem;max-width:360px;margin:0 auto">
      <button class="yoda-btn" style="width:100%;box-sizing:border-box;margin:0" onclick="restart()">重新測驗一次 ↺</button>
    </div>
    <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:1.5rem">茂偉低碳 MOWINTECH · 25 年工商業光伏與儲能資產運營專家</div>`);

function restart() {
  state = { idx: -1, score: 0, gv: 50, cls: [] };
  oi = 0; PB.style.width = '0%';
  fade(showStart);
}

// Global Exports
['startOpening', 'nextOpening', 'showRound', 'renderGauge', 'gaugeDone', 'setCls', 'clsCheck', 'giveAnswer', 'abPick', 'record', 'advance', 'showResult', 'restart', 'fade', 'renderClassify', 'renderAB'].forEach(n => window[n] = eval(n));
window.state = state;

showStart();
</script>
